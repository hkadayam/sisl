name: 'Load Conan Cache'
description: 'Loads Local Conan Cache'
inputs:
  key_prefix:
    description: 'Cache prefix'
    required: true
    default: 'Deps'
  fail_on_cache_miss:
    description: 'Fail if key missing'
    required: false
    default: false
  path:
    description: 'Recipe path'
    required: false
    default: '.'
  load_any:
    description: 'Load cache miss'
    required: false
    default: 'False'
outputs:
  cache-hit:
    description: 'Cache match found'
    value: ${{ steps.restore-cache.outputs.cache-hit }}
runs:
  using: "composite"
  steps:
    - id: hash-key-primary
      shell: bash
      run: |
        grep "self.requires" ${{ inputs.path }}/conanfile.py > ${{ inputs.path }}/conan_dependencies.txt
        echo "key=${{ inputs.path }}/conan_dependencies.txt" >> $GITHUB_OUTPUT

    - id: hash-key-3rd
      shell: bash
      run: |
        echo "keys=${{ inputs.path }}/3rd_party/**/conanfile.py" >> $GITHUB_OUTPUT

    - name: Restore Cache
      id: restore-cache
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.conan2/p
        key: ${{ inputs.key_prefix }}-${{ hashFiles(steps.hash-key-primary.outputs.key, steps.hash-key-3rd.outputs.keys) }}
        fail-on-cache-miss: ${{ inputs.fail_on_cache_miss }}